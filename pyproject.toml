[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extractor"
version = "0.1.0"
description = "Extract a legacy VPS database over SSH and download the images it references"
requires-python = ">=3.10"
dependencies = [
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "psycopg[binary]>=3.1",
  "paramiko>=3.4",
  "httpx>=0.27",
  "pyyaml>=6",
  "pydantic>=2",
  "typer>=0.12",
  "rich>=13",
  "tenacity>=8.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-httpserver>=1.0"]

[project.scripts]
extractor = "extractor.cli:app"

[tool.setuptools.packages.find]
include = ["extractor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
